plugins { id 'com.android.application' }
def versionProperties = new Properties()
file('../version.properties').withInputStream { versionProperties.load(it) }
android {
    namespace 'de.stenopfad.app'
    compileSdk 35
    defaultConfig {
        applicationId 'de.stenopfad.app'
        minSdk 26
        targetSdk 35
        versionCode versionProperties['VERSION_CODE'].toInteger()
        versionName versionProperties['VERSION_NAME']
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
